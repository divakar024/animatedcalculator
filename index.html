<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="calculator" id="calculator">
        <div class="display" id="display-wrap">
          <div class="display-glow"></div>
          <div class="expression" id="expression">&nbsp;</div>
          <div class="result" id="result">0</div>
        </div>

        <div class="keys" id="keys">
          <button class="key key--util" data-action="clear">AC</button>
          <button class="key key--util" data-action="delete">⌫</button>
          <button class="key key--util" data-action="percent">%</button>
          <button class="key key--op" data-action="operator" data-value="÷">
            ÷
          </button>

          <button class="key key--num" data-action="number" data-value="7">
            7
          </button>
          <button class="key key--num" data-action="number" data-value="8">
            8
          </button>
          <button class="key key--num" data-action="number" data-value="9">
            9
          </button>
          <button class="key key--op" data-action="operator" data-value="×">
            ×
          </button>

          <button class="key key--num" data-action="number" data-value="4">
            4
          </button>
          <button class="key key--num" data-action="number" data-value="5">
            5
          </button>
          <button class="key key--num" data-action="number" data-value="6">
            6
          </button>
          <button class="key key--op" data-action="operator" data-value="−">
            −
          </button>

          <button class="key key--num" data-action="number" data-value="1">
            1
          </button>
          <button class="key key--num" data-action="number" data-value="2">
            2
          </button>
          <button class="key key--num" data-action="number" data-value="3">
            3
          </button>
          <button class="key key--op" data-action="operator" data-value="+">
            +
          </button>

          <button
            class="key key--num key--zero"
            data-action="number"
            data-value="0">
            0
          </button>
          <button class="key key--num" data-action="decimal">.</button>
          <button class="key key--equals" data-action="equals">=</button>
        </div>
      </div>

      <p class="hint">
        Type numbers, click operators, press <kbd>Enter</kbd> for =,
        <kbd>Esc</kbd> to clear.
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
